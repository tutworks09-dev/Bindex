
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BINDEX | Profile</title>

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080e14;
      color: #edf6fc;
      font-family: Vazirmatn, sans-serif;
      min-height: 100vh;
    }

    header {
      height: 65px;
      background: #0e1821;
      border-bottom: 1px solid #203441;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
    }

    .logo {
      color: #12a8df;
      font-size: 25px;
      font-weight: 800;
    }

    header a {
      color: #b8d3e2;
      text-decoration: none;
    }

    .container {
      max-width: 950px;
      width: 92%;
      margin: 35px auto;
    }

    .card {
      background: #0e1821;
      border: 1px solid #203441;
      border-radius: 18px;
      overflow: hidden;
    }

    .banner {
      height: 260px;
      background: linear-gradient(120deg, #075276, #071b35);
      background-size: cover;
      background-position: center;
    }

    .content {
      padding: 0 28px 28px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 6px solid #0e1821;
      background: #193344;
      object-fit: cover;
      margin-top: -62px;
      position: relative;
    }

    .name {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 10px;
      font-size: 24px;
      font-weight: 800;
      flex-wrap: wrap;
    }

    .verified {
      color: #1da9e0;
      display: none;
      font-size: 19px;
    }

    .username {
      color: #89a6b8;
      direction: ltr;
      text-align: right;
      margin-top: 5px;
    }

    .id {
      color: #708c9e;
      font-size: 12px;
      direction: ltr;
      text-align: right;
      margin-top: 9px;
      overflow-wrap: anywhere;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 25px;
    }

    .item {
      background: #12212c;
      border: 1px solid #203441;
      border-radius: 12px;
      padding: 15px;
      min-width: 0;
    }

    .label {
      color: #829eaf;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .value {
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    #loading, #error {
      text-align: center;
      padding: 60px 15px;
      color: #9bb7c8;
    }

    #error { color: #ff7777; }

    .spinner {
      width: 35px;
      height: 35px;
      border: 3px solid #203b4d;
      border-top-color: #16a9df;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    [hidden] { display: none !important; }

    @media(max-width: 600px) {
      .banner { height: 190px; }
      .content { padding: 0 18px 22px; }
      .avatar { width: 105px; height: 105px; }
      .name { font-size: 21px; }
      .details { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">BINDEX</div>
  <a href="./">صفحه اصلی <i class="fa-solid fa-arrow-left"></i></a>
</header>

<main class="container">

  <div id="loading">
    <div class="spinner"></div>
    در حال دریافت پروفایل...
  </div>

  <div id="error" hidden></div>

  <section id="profile" class="card" hidden>
    <div id="banner" class="banner"></div>

    <div class="content">
      <img id="avatar" class="avatar" alt="Avatar">

      <div class="name">
        <span id="displayName"></span>
        <i id="verified" class="fa-solid fa-circle-check verified"></i>
      </div>

      <div id="username" class="username"></div>
      <div id="userId" class="id"></div>

      <div class="details">
        <div class="item">
          <div class="label">نام نمایشی</div>
          <div id="dName" class="value"></div>
        </div>

        <div class="item">
          <div class="label">نام کاربری</div>
          <div id="dUsername" class="value"></div>
        </div>

        <div class="item">
          <div class="label">شناسه کاربر</div>
          <div id="dId" class="value"></div>
        </div>

        <div class="item">
          <div class="label">وضعیت تأیید</div>
          <div id="dVerified" class="value"></div>
        </div>

        <div class="item">
          <div class="label">تاریخ عضویت</div>
          <div id="dDate" class="value"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<script>
'use strict';

// BINDEX SUPABASE CONFIG
const SUPABASE_URL = 'https://hlescjwegrtvwgtqsemm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9rRjxE8CFQJMm-oy74wOw_VRtHgguY';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const el = id => document.getElementById(id);

function showError(message) {
  el('loading').hidden = true;
  el('profile').hidden = true;
  el('error').hidden = false;
  el('error').textContent = message;
}

function dateFormat(value) {
  if (!value) return 'نامشخص';

  const date = new Date(value);

  if (isNaN(date.getTime())) return 'نامشخص';

  return date.toLocaleDateString('fa-IR');
}

function renderProfile(user) {
  const username = user.username || 'unknown';
  const displayName = user.display_name || username;

  el('displayName').textContent = displayName;
  el('username').textContent = '@' + username;
  el('userId').textContent = 'ID: ' + user.id;

  el('dName').textContent = displayName;
  el('dUsername').textContent = username;
  el('dId').textContent = user.id;
  el('dDate').textContent = dateFormat(user.created_at);

  const verified = user.is_verified === true;

  el('verified').style.display = verified ? 'inline-block' : 'none';
  el('dVerified').textContent = verified ? 'تأیید شده' : 'تأیید نشده';

  el('avatar').src = user.avatar_url ||
    'https://ui-avatars.com/api/?name=' +
    encodeURIComponent(username) +
    '&background=123247&color=ffffff&size=256';

  if (user.banner_url) {
    el('banner').style.backgroundImage =
      'url("' + user.banner_url + '")';
  }

  el('loading').hidden = true;
  el('error').hidden = true;
  el('profile').hidden = false;
}

async function loadProfile() {
  try {
    const params = new URLSearchParams(location.search);
    const username = params.get('u');

    if (!username || !username.trim()) {
      showError('نام کاربری در آدرس وجود ندارد.');
      return;
    }

    const { data, error } = await supabaseClient
      .from('profiles')
      .select('*')
      .ilike('username', username.trim())
      .maybeSingle();

    if (error) {
      throw error;
    }

    if (!data) {
      showError('این کاربر در BINDEX پیدا نشد.');
      return;
    }

    renderProfile(data);

  } catch (error) {
    console.error('BINDEX Profile:', error);
    showError('خطا در دریافت پروفایل: ' + error.message);
  }
}

loadProfile();
</script>

</body>
</html>
