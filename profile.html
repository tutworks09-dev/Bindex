
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پروفایل | BINDEX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
  --bg:#080e14;
  --panel:#0e1821;
  --panel2:#111f2a;
  --blue:#009ACE;
  --cyan:#31b9e8;
  --text:#f4f8fb;
  --muted:#91a3b1;
  --border:rgba(145,163,177,.15);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  background:var(--bg);
  color:var(--text);
  font-family:'Vazirmatn',sans-serif;
  min-height:100vh;
}

button {
  font-family:inherit;
  cursor:pointer;
}

/* Header */
header {
  height:95px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 4%;
}

.brand {
  display:flex;
  align-items:center;
  gap:13px;
  direction:ltr;
  font-family:'Space Grotesk',sans-serif;
  font-size:32px;
  font-weight:700;
}

.brand-icon {
  width:56px;
  height:56px;
  border-radius:18px;
  background:linear-gradient(135deg,#16b7e9,#0076a5);
  display:grid;
  place-items:center;
  color:white;
  font-size:27px;
}

.back {
  color:var(--muted);
  text-decoration:none;
  font-size:15px;
}

.back:hover {
  color:var(--cyan);
}

/* Main */
.container {
  width:calc(100% - 8%);
  max-width:1565px;
  margin:47px auto;
}

/* Cover */
.cover {
  width:90%;
  aspect-ratio:4096 / 1506;
  min-height:180px;
  max-height:490px;
  margin:0 auto;
  border-radius:38px;
  border:1px solid rgba(49,185,232,.3);
  background:
    radial-gradient(circle at 75% 25%,rgba(0,154,206,.38),transparent 40%),
    repeating-linear-gradient(
      45deg,
      transparent 0 55px,
      rgba(49,185,232,.08) 56px 57px
    ),
    linear-gradient(120deg,#0d2939,#123d53,#091b29);
  position:relative;
  overflow:hidden;
}

.cover::after {
  content:"BINDEX";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(50px,9vw,120px);
  font-weight:800;
  letter-spacing:5px;
  color:rgba(255,255,255,.07);
  pointer-events:none;
}

.cover-button {
  position:absolute;
  top:30px;
  left:30px;
  z-index:2;
  background:#080e14;
  color:white;
  border:0;
  border-radius:20px;
  padding:20px 24px;
  font-size:15px;
}

/* Profile identity */
.profile-area {
  position:relative;
  z-index:3;
}

.identity {
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:15px;
  padding-right:28px;
  margin-top:-85px;
  min-height:200px;
}

.avatar {
  width:200px;
  height:200px;
  flex-shrink:0;
  border-radius:50%;
  border:9px solid var(--bg);
  background:linear-gradient(145deg,#087ca5,#10455a);
  display:grid;
  place-items:center;
  color:#b9edff;
  font-size:90px;
}

.identity-name {
  font-size:38px;
  font-weight:800;
}

.verified {
  color:var(--blue);
  font-size:23px;
  margin-right:5px;
}

/* Bottom row: follow left, stats right */
.profile-bottom {
  border-top:1px solid var(--border);
  margin-top:25px;
  padding:19px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  min-height:100px;
}

.follow-btn {
  background:var(--blue);
  border:1px solid var(--blue);
  color:white;
  border-radius:16px;
  padding:12px 19px;
  font-size:13px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
}

.follow-btn:hover {
  background:#08addf;
}

/* Stats */
.stats {
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:35px;
  margin:0;
  padding:0;
  border:0;
}

.stat {
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:15px;
  white-space:nowrap;
}

.stat strong {
  color:white;
  font-size:22px;
}

.stat i {
  font-size:20px;
}

/* Content */
.content {
  display:grid;
  grid-template-columns:minmax(0,1fr) 350px;
  gap:18px;
  margin-top:35px;
}

.posts-panel,
.info-panel {
  background:linear-gradient(145deg,#0d1925,#0a131c);
  border:1px solid rgba(0,154,206,.4);
  border-radius:23px;
  overflow:hidden;
}

.tabs {
  display:flex;
  border-bottom:1px solid var(--border);
}

.tab {
  flex:1;
  padding:20px 10px;
  text-align:center;
  color:var(--muted);
  background:transparent;
  border:0;
  border-bottom:3px solid transparent;
  font-size:15px;
}

.tab.active {
  color:white;
  border-bottom-color:var(--blue);
  background:rgba(0,154,206,.08);
}

.tab i {
  margin-left:8px;
}

.empty {
  margin:18px;
  padding:35px 15px;
  text-align:center;
  border-radius:17px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--border);
}

.empty i {
  font-size:38px;
  color:#7896ae;
  margin-bottom:12px;
}

.empty h3 {
  font-size:18px;
  margin-bottom:8px;
}

.empty p {
  color:var(--muted);
  font-size:14px;
}

/* Sidebar */
.info-panel {
  padding:22px;
  height:max-content;
}

.info-title {
  font-size:19px;
  font-weight:700;
  margin-bottom:18px;
}

.info-item {
  padding:16px 0;
  border-top:1px solid var(--border);
  color:var(--muted);
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:14px;
}

.info-item i {
  color:var(--blue);
  margin-left:7px;
}

/* Mobile */
@media(max-width:800px) {
  header {
    height:75px;
  }

  .brand {
    font-size:25px;
  }

  .brand-icon {
    width:45px;
    height:45px;
  }

  .container {
    width:94%;
    margin-top:28px;
  }

  .cover {
    width:94%;
    min-height:140px;
    border-radius:22px;
  }

  .cover-button {
    top:12px;
    left:12px;
    padding:12px 15px;
    font-size:12px;
    border-radius:13px;
  }

  .identity {
    padding-right:12px;
    gap:9px;
    margin-top:-48px;
    min-height:125px;
  }

  .avatar {
    width:115px;
    height:115px;
    font-size:52px;
    border-width:6px;
  }

  .identity-name {
    font-size:23px;
  }

  .verified {
    font-size:16px;
  }

  .profile-bottom {
    margin-top:18px;
    padding:17px 5px;
    min-height:80px;
    gap:10px;
  }

  .follow-btn {
    padding:11px 13px;
    font-size:12px;
    border-radius:13px;
  }

  .stats {
    gap:12px;
  }

  .stat {
    font-size:11px;
    gap:5px;
  }

  .stat strong {
    font-size:17px;
  }

  .stat i {
    font-size:14px;
  }

  .content {
    grid-template-columns:1fr;
    margin-top:22px;
  }

  .info-panel {
    order:2;
  }
}

@media(max-width:390px) {
  .stat {
    font-size:10px;
    gap:4px;
  }

  .stat i {
    display:none;
  }

  .avatar {
    width:100px;
    height:100px;
  }

  .identity-name {
    font-size:20px;
  }

  .stats {
    gap:9px;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="back">
    <i class="fa-solid fa-arrow-right"></i>
    بازگشت به خانه
  </a>

  <div class="brand">
    <div class="brand-icon">
      <i class="fa-solid fa-gamepad"></i>
    </div>
    <span>Bindex<span style="color:#31b9e8">.</span></span>
  </div>
</header>

<main class="container">

  <!-- Banner -->
  <section class="cover" id="cover">
    <button class="cover-button" onclick="document.getElementById('bannerInput').click()">
      تغییر بنر
      <i class="fa-solid fa-camera"></i>
    </button>

    <input type="file" id="bannerInput" accept="image/*" hidden>
  </section>

  <!-- Profile identity -->
  <section class="profile-area">

    <div class="identity">

      <div class="avatar">
        <i class="fa-solid fa-user"></i>
      </div>

      <h1 class="identity-name">
        گیمر BINDEX
        <i class="fa-solid fa-circle-check verified"></i>
      </h1>

    </div>

    <!-- Follow button left / Stats right -->
    <div class="profile-bottom">

      <button class="follow-btn" onclick="showMessage('قابلیت دنبال کردن به‌زودی فعال می‌شود')">
        <i class="fa-solid fa-user-plus"></i>
        دنبال کردن
      </button>

      <div class="stats">

        <div class="stat">
          <i class="fa-solid fa-file-lines"></i>
          <strong>0</strong>
          <span>پست</span>
        </div>

        <div class="stat">
          <i class="fa-solid fa-users"></i>
          <strong>0</strong>
          <span>دنبال‌کننده</span>
        </div>

        <div class="stat">
          <i class="fa-solid fa-user"></i>
          <strong>0</strong>
          <span>دنبال‌شونده</span>
        </div>

      </div>

    </div>

  </section>

  <!-- Posts and information -->
  <section class="content">

    <div class="posts-panel">

      <div class="tabs">

        <button class="tab active" onclick="changeTab(this)">
          <i class="fa-solid fa-grid-2"></i>
          پست‌ها
        </button>

        <button class="tab" onclick="changeTab(this)">
          <i class="fa-solid fa-gamepad"></i>
          بازی‌ها
        </button>

        <button class="tab" onclick="changeTab(this)">
          <i class="fa-solid fa-circle-info"></i>
          درباره
        </button>

      </div>

      <div class="empty">
        <i class="fa-regular fa-file-lines"></i>
        <h3>هنوز پستی وجود ندارد</h3>
        <p>وقتی پستی منتشر شود، اینجا نمایش داده می‌شود.</p>
      </div>

    </div>

    <aside class="info-panel">

      <h2 class="info-title">
        <i class="fa-solid fa-user" style="color:#009ACE"></i>
        اطلاعات کاربر
      </h2>

      <div class="info-item">
        <span>
          <i class="fa-solid fa-gamepad"></i>
          نام نمایشی
        </span>
        <span>گیمر BINDEX</span>
      </div>

      <div class="info-item">
        <span>
          <i class="fa-solid fa-calendar-days"></i>
          عضویت
        </span>
        <span>عضو کامیونیتی</span>
      </div>

      <div class="info-item">
        <span>
          <i class="fa-solid fa-link"></i>
          وب‌سایت
        </span>
        <span>—</span>
      </div>

    </aside>

  </section>

</main>

<script>
function showMessage(message) {
  alert(message);
}

function changeTab(button) {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });

  button.classList.add('active');
}

/* Banner preview */
document.getElementById('bannerInput').addEventListener('change', function() {
  const file = this.files[0];

  if (!file) return;

  if (!file.type.startsWith('image/')) {
    alert('لطفاً یک تصویر انتخاب کن.');
    return;
  }

  if (file.size > 8 * 1024 * 1024) {
    alert('حجم تصویر باید کمتر از ۸ مگابایت باشد.');
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {
    document.getElementById('cover').style.background =
      `url("${event.target.result}") center/cover no-repeat`;
  };

  reader.readAsDataURL(file);
});
</script>

</body>
</html>
