
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پروفایل | BINDEX</title>

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Vazirmatn, sans-serif;
      background: #080e14;
      color: #edf6fc;
      min-height: 100vh;
    }

    header {
      height: 65px;
      background: #0d1720;
      border-bottom: 1px solid #1c303e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
    }

    .logo {
      color: #19a9df;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .home {
      color: #b8d3e2;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 1000px;
      width: 92%;
      margin: 35px auto;
    }

    .profile-card {
      background: #0e1821;
      border: 1px solid #1c303e;
      border-radius: 18px;
      overflow: hidden;
    }

    .banner {
      height: 280px;
      background: linear-gradient(120deg, #075276, #071b35);
      position: relative;
      background-size: cover;
      background-position: center;
    }

    .profile-info {
      padding: 0 30px 28px;
      position: relative;
    }

    .avatar {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      border: 6px solid #0e1821;
      background: #152b3a;
      object-fit: cover;
      margin-top: -65px;
      position: relative;
      display: block;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .display-name {
      font-size: 24px;
      font-weight: 800;
    }

    .verified {
      color: #20b8ed;
      font-size: 19px;
      display: none;
    }

    .username {
      color: #8ca9ba;
      direction: ltr;
      text-align: right;
      margin-top: 4px;
      font-size: 14px;
    }

    .profile-id {
      color: #6f8b9d;
      direction: ltr;
      text-align: right;
      font-size: 12px;
      margin-top: 10px;
      overflow-wrap: anywhere;
    }

    .status {
      color: #6f8b9d;
      font-size: 13px;
      margin-top: 18px;
    }

    .status.error { color: #ff7777; }

    .loading {
      text-align: center;
      padding: 70px 15px;
      color: #9bb7c8;
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 3px solid #203b4d;
      border-top-color: #16a9df;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 25px;
    }

    .detail {
      background: #101f2a;
      border: 1px solid #1c3443;
      border-radius: 12px;
      padding: 15px;
      min-width: 0;
    }

    .detail-label {
      color: #829eaf;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .detail-value {
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    @media(max-width: 600px) {
      .banner { height: 190px; }
      .profile-info { padding: 0 18px 22px; }
      .avatar { width: 105px; height: 105px; margin-top: -53px; }
      .display-name { font-size: 21px; }
      .details { grid-template-columns: 1fr; }
      .container { margin-top: 20px; }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">BINDEX</div>
  <a class="home" href="./">صفحه اصلی <i class="fa-solid fa-arrow-left"></i></a>
</header>

<main class="container">

  <div id="loading" class="loading">
    <div class="spinner"></div>
    در حال دریافت پروفایل...
  </div>

  <div id="errorBox" class="loading status error" hidden></div>

  <section id="profileCard" class="profile-card" hidden>
    <div id="banner" class="banner"></div>

    <div class="profile-info">
      <img id="avatar" class="avatar" alt="Profile avatar">

      <div class="name-row">
        <h1 id="displayName" class="display-name"></h1>
        <i id="verified" class="fa-solid fa-circle-check verified"
           title="حساب تأیید شده"></i>
      </div>

      <div id="username" class="username"></div>
      <div id="profileId" class="profile-id"></div>

      <div class="details">
        <div class="detail">
          <div class="detail-label">نام نمایشی</div>
          <div id="detailName" class="detail-value">-</div>
        </div>

        <div class="detail">
          <div class="detail-label">نام کاربری</div>
          <div id="detailUsername" class="detail-value">-</div>
        </div>

        <div class="detail">
          <div class="detail-label">شناسه کاربر (ID)</div>
          <div id="detailId" class="detail-value">-</div>
        </div>

        <div class="detail">
          <div class="detail-label">وضعیت حساب</div>
          <div id="detailVerified" class="detail-value">-</div>
        </div>

        <div class="detail">
          <div class="detail-label">تاریخ عضویت</div>
          <div id="createdAt" class="detail-value">-</div>
        </div>
      </div>

      <div id="status" class="status"></div>
    </div>
  </section>

</main>

<script>
  const SUPABASE_URL = 'https://hlescjwegrtvwgtqsemm.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_9rRjxE8CFQJMm-oy74wOw_VRtHgguY';

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storage: window.localStorage
      }
    }
  );

  const $ = (id) => document.getElementById(id);

  function showError(message) {
    $('loading').hidden = true;
    $('profileCard').hidden = true;
    $('errorBox').hidden = false;
    $('errorBox').textContent = message;
  }

  function formatDate(dateValue) {
    if (!dateValue) return 'نامشخص';

    const date = new Date(dateValue);

    if (Number.isNaN(date.getTime())) return 'نامشخص';

    return date.toLocaleDateString('fa-IR');
  }

  function renderProfile(profile) {
    $('displayName').textContent =
      profile.display_name || profile.username || 'کاربر BINDEX';

    $('username').textContent = '@' + profile.username;
    $('profileId').textContent = 'ID: ' + profile.id;

    $('detailName').textContent =
      profile.display_name || 'ثبت نشده';

    $('detailUsername').textContent =
      profile.username || 'نامشخص';

    $('detailId').textContent = profile.id || 'نامشخص';

    $('detailVerified').textContent =
      profile.is_verified === true ? 'تأیید شده' : 'تأیید نشده';

    $('createdAt').textContent = formatDate(profile.created_at);

    if (profile.is_verified === true) {
      $('verified').style.display = 'inline-block';
    } else {
      $('verified').style.display = 'none';
    }

    if (profile.avatar_url) {
      $('avatar').src = profile.avatar_url;
    } else {
      $('avatar').src =
        'https://ui-avatars.com/api/?name=' +
        encodeURIComponent(profile.username || 'BINDEX') +
        '&background=123247&color=ffffff&size=256';
    }

    if (profile.banner_url) {
      $('banner').style.backgroundImage =
        `url("${profile.banner_url}")`;
    }

    $('loading').hidden = true;
    $('errorBox').hidden = true;
    $('profileCard').hidden = false;
  }

  async function loadProfile() {
    try {
      const params = new URLSearchParams(window.location.search);
      const requestedUsername = params.get('u');

      if (!requestedUsername || !requestedUsername.trim()) {
        showError('نام کاربری در آدرس مشخص نشده است.');
        return;
      }

      const username = requestedUsername.trim();

      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .ilike('username', username)
        .maybeSingle();

      if (error) throw error;

      if (!profile) {
        showError('کاربری با نام کاربری «' + username + '» پیدا نشد.');
        return;
      }

      renderProfile(profile);

    } catch (error) {
      console.error('BINDEX profile error:', error);
      showError('خطا در دریافت پروفایل: ' + error.message);
    }
  }

  loadProfile();
</script>

</body>
</html>
